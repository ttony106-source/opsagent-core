name: Policy Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: pytest -q

      - name: Validate policy artifacts (fail-closed)
        run: python scripts/validate_policies.py

      - name: Validate OpsAgent policy binding
        run: PYTHONPATH=src python -m opsagent validate
