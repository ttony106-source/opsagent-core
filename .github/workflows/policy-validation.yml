name: Policy Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate policy artifacts (fail-closed)
        run: python scripts/validate_policies.py
